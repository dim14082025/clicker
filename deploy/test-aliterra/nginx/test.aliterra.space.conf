# /etc/nginx/sites-available/test.aliterra.space
#
# Append this to your existing test.aliterra.space server { } block,
# OR replace the file entirely if you don't have a non-trivial config there.
#
# Key idea:
#   - /api/v2/   → proxied to the Node.js LUX backend on 127.0.0.1:3001
#   - /backend/  → leave untouched (existing PHP backend keeps working)
#   - everything else → served from the static React build (try_files SPA fallback)

server {
    listen 80;
    listen [::]:80;
    server_name test.aliterra.space;
    # If you already have TLS, keep your listen 443 / ssl_certificate lines.
    # The example below assumes plain HTTP; copy ssl_* directives from your
    # existing server block.

    root /var/www/test.aliterra.space/frontend;
    index index.html;

    # Allow larger JSON bodies just in case (32 KB default in app, this is the cap)
    client_max_body_size 64k;

    # --- New Node backend (LUX clicker) ---------------------------------
    location /api/v2/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # --- Existing PHP backend (do not touch) ----------------------------
    # If you have a `location /backend/ { ... fastcgi_pass ... }` block already,
    # keep it. The new /api/v2/ block above is additive and does not collide.

    # --- Static React frontend ------------------------------------------
    # All other routes fall through to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed asset bundles
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
